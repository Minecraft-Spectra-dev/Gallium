plugins {
    id 'base'
    id 'maven-publish'
    id 'dev.architectury.loom-no-remap' version "${loom_version}" apply false
    id 'dev.architectury.loom-remap' version "${loom_version}" apply false
    id 'com.replaymod.preprocess' version '2441400cbf'
}

subprojects {
    def target = gradle.ext.galliumTargets[project.name]
    ext.minecraft_line = target.minecraftLine
    ext.mod_loader = target.loader
}

preprocess {
    strictExtraMappings = false

    def nodes = [:]
    gradle.ext.galliumTargets.each { String name, target ->
        int mcVersion = encodeMinecraftLine(target.minecraftLine)
        nodes[name] = createNode(name, mcVersion, 'mojang')
        project(":${name}").ext.mcVersion = mcVersion
    }
    def fabricTargets = gradle.ext.galliumTargets.findAll { name, target -> target.loader == 'fabric' }
            .keySet().sort { a, b -> encodeMinecraftLine(a) <=> encodeMinecraftLine(b) }
    fabricTargets.collate(2, 1, false).each { pair -> nodes[pair[0]].link(nodes[pair[1]], null) }
    gradle.ext.galliumTargets.findAll { name, target -> target.loader != 'fabric' }.each { name, target ->
        nodes[target.minecraftLine].link(nodes[name], null)
    }
}

// Loader variants share Mojang names within a Minecraft version.
// Keep conditional preprocessing without remapping loader-specific overloads.
gradle.projectsEvaluated {
    def core = file('versions/mainProject').text.trim()
    def graph = extensions.getByName('preprocess').getRootNode(core)
    subprojects.each { target ->
        def node = graph.findNode(target.name)
        if (node.project != core) {
            def link = node.links.find { it.first.findNode(core) != null } ?: graph.findParent(node)
            if (node.mcVersion == link.first.mcVersion && node.mappings == 'mojang'
                    && link.first.mappings == 'mojang' && link.second.first == null) {
                target.tasks.withType(com.replaymod.gradle.preprocess.PreprocessTask).configureEach {
                    sourceMappings = null
                    destinationMappings = null
                    intermediateMappingsName.unset()
                }
            }
        }
    }
}

static int encodeMinecraftLine(String line) {
    def parts = line.tokenize('.').collect { it as int }
    if (parts[0] == 1) return 10_000 + parts[1] * 100 + (parts.size() > 2 ? parts[2] : 0)
    return 10_000 + parts[0] * 100 + parts[1]
}

tasks.named('build') {
    dependsOn 'buildAndGather'
}

tasks.register('buildAndGather', Sync) {
    group = 'build'
    description = 'Builds the declared loader/version matrix and gathers its production jars'
    into layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.FAIL

    subprojects.each { target ->
        dependsOn target.tasks.named('build')
        from target.ext.productionJar.flatMap { it.archiveFile }
    }
}

static def convertDependencyToSuffix(String dependency) {
    def dep = dependency.replaceAll(/\s+/, '')

    def exactPattern = ~/^([0-9.]+)$/
    def exactMatcher = exactPattern.matcher(dep)
    if (exactMatcher.find()) {
        def version = exactMatcher.group(1)
        return "${version}"
    }

    // Wildcard form like "26.1.x" / "1.21.x" — kept literally in the jar name so the
    // file name reflects the dependency declaration verbatim (".x" reads as "any patch").
    // Some downstream tooling parses jar names as version strings; if that becomes a
    // problem prefer renaming the dependency itself rather than re-introducing a
    // collapsed form here, since the two should stay consistent.
    def wildcardPattern = ~/^([0-9.]+x)$/
    def wildcardMatcher = wildcardPattern.matcher(dep)
    if (wildcardMatcher.find()) {
        return wildcardMatcher.group(1)
    }

    def rangePattern = ~/>=([0-9.]+)<=([0-9.]+)/
    def rangeMatcher = rangePattern.matcher(dep)
    if (rangeMatcher.find()) {
        def minVersion = rangeMatcher.group(1)
        def maxVersion = rangeMatcher.group(2)
        return "${minVersion}-${maxVersion}"
    }

    def minPattern = ~/>=([0-9.]+)/
    def minMatcher = minPattern.matcher(dep)
    if (minMatcher.find()) {
        def version = minMatcher.group(1)
        return "${version}+"
    }

    def tildePattern = ~/~([0-9.]+)/
    def tildeMatcher = tildePattern.matcher(dep)
    if (tildeMatcher.find()) {
        def version = tildeMatcher.group(1)
        return "${version}"
    }

    return dependency
}
